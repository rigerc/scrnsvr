[package]
name = "scrnsvr-app"
description = "Scrnsvr command line and layer-shell renderer"
default-run = "scrnsvr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "scrnsvr-renderer"
path = "src/main.rs"

[dependencies]
scrnsvr-core.workspace = true
scrnsvr-render.workspace = true
scrnsvr-platform.workspace = true
glow.workspace = true
libc.workspace = true
wayland-client.workspace = true
chrono = { version = "=0.4.45", features = ["clock"], default-features = false }
png = "=0.18.1"
rand = "=0.9.5"
serde_json = { version = "=1.0.154", features = ["preserve_order", "float_roundtrip"] }
toml = "=0.8.23"
tempfile = "=3.27.0"

[[bin]]
name = "scrnsvr"
path = "src/cli.rs"
