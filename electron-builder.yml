appId: com.scrnsvr.desktop
productName: Scrnsvr
directories:
  output: release
  buildResources: assets
files:
  - dist/**
  - '!dist/native/generated/**'
  - packaging/**
  - assets/**
  - package.json
asarUnpack:
  - dist/native/scrnsvr-renderer
linux:
  target: [AppImage, deb]
  syncDesktopName: true
  category: Utility
  maintainer: rigerc <bond@bsgb.nl>
  icon: assets/icon.svg
  synopsis: Ambient shader screensaver
  description: A low-power, shader-based screensaver for Linux desktops.
  desktop:
    entry:
      Name: Scrnsvr
      Comment: Ambient shader screensaver
      StartupWMClass: scrnsvr
extraResources:
  - from: packaging/systemd/scrnsvr.service
    to: systemd/scrnsvr.service
deb:
  afterInstall: packaging/post-install.sh
