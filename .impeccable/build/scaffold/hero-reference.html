<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: model-pick.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#171719}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1280px">
  <div class="r-top-bar region chrome" data-region="top-bar"><!-- matte charcoal application bar and thin lower rule --></div>
  <div class="r-brand region text" data-region="brand"><!-- scrnsvr wordmark in warm ivory --><p style="font-size:var(--r-brand-font);line-height:1.05;margin:0">brand</p></div>
  <div class="r-nav-shaders region control" data-region="nav-shaders"><!-- Shaders active tab with coral underline: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-shaders); a control need not have button chrome --></div>
  <div class="r-nav-clock region control" data-region="nav-clock"><!-- Clock tab: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-clock); a control need not have button chrome --></div>
  <div class="r-nav-settings region control" data-region="nav-settings"><!-- Settings tab: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-settings); a control need not have button chrome --></div>
  <div class="r-bank-heading region text" data-region="bank-heading"><!-- SHADER BANK silkscreen label --><p style="font-size:var(--r-bank-heading-font);line-height:1.05;margin:0">bank-heading</p></div>
  <div class="r-thumb-1 region control" data-region="thumb-1"><!-- Live WebGL shader canvas rendered by the actual scrnsvr shader runtime.: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop thumb-1); a control need not have button chrome --></div>
  <div class="r-thumb-label-1 region text" data-region="thumb-label-1"><!-- Aurora Veil name --><p style="font-size:var(--r-thumb-label-1-font);line-height:1.05;margin:0">thumb-label-1</p></div>
  <div class="r-thumb-2 region control" data-region="thumb-2"><!-- Live WebGL shader canvas rendered by the actual scrnsvr shader runtime.: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop thumb-2); a control need not have button chrome --></div>
  <div class="r-thumb-label-2 region text" data-region="thumb-label-2"><!-- Chromatic Plasma name --><p style="font-size:var(--r-thumb-label-2-font);line-height:1.05;margin:0">thumb-label-2</p></div>
  <div class="r-thumb-3 region control" data-region="thumb-3"><!-- Live WebGL shader canvas rendered by the actual scrnsvr shader runtime.: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop thumb-3); a control need not have button chrome --></div>
  <div class="r-thumb-label-3 region text" data-region="thumb-label-3"><!-- Tidal Caustics name --><p style="font-size:var(--r-thumb-label-3-font);line-height:1.05;margin:0">thumb-label-3</p></div>
  <div class="r-thumb-4 region control" data-region="thumb-4"><!-- Live WebGL shader canvas rendered by the actual scrnsvr shader runtime.: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop thumb-4); a control need not have button chrome --></div>
  <div class="r-thumb-label-4 region text" data-region="thumb-label-4"><!-- Silk Ribbons name --><p style="font-size:var(--r-thumb-label-4-font);line-height:1.05;margin:0">thumb-label-4</p></div>
  <div class="r-thumb-5 region control" data-region="thumb-5"><!-- Live WebGL shader canvas rendered by the actual scrnsvr shader runtime.: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop thumb-5); a control need not have button chrome --></div>
  <div class="r-thumb-label-5 region text" data-region="thumb-label-5"><!-- Mesh Gradient name --><p style="font-size:var(--r-thumb-label-5-font);line-height:1.05;margin:0">thumb-label-5</p></div>
  <div class="r-thumb-6 region control" data-region="thumb-6"><!-- Live WebGL shader canvas rendered by the actual scrnsvr shader runtime.: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop thumb-6); a control need not have button chrome --></div>
  <div class="r-thumb-label-6 region text" data-region="thumb-label-6"><!-- Flow Field name --><p style="font-size:var(--r-thumb-label-6-font);line-height:1.05;margin:0">thumb-label-6</p></div>
  <div class="r-preview region control" data-region="preview"><!-- Live WebGL shader canvas rendered by the actual scrnsvr shader runtime.: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop preview); a control need not have button chrome --></div>
  <div class="r-live-label region text" data-region="live-label"><!-- LIVE PREVIEW status label --><p style="font-size:var(--r-live-label-font);line-height:1.05;margin:0">live-label</p></div>
  <div class="r-preview-name region text" data-region="preview-name"><!-- Aurora Veil selected shader title --><p style="font-size:var(--r-preview-name-font);font-family:var(--r-preview-name-family),sans-serif;font-weight:var(--r-preview-name-weight);line-height:1.05;margin:0">preview-name</p></div>
  <div class="r-inspector-heading region text" data-region="inspector-heading"><!-- ADJUST SHADER silkscreen inspector title --><p style="font-size:var(--r-inspector-heading-font);line-height:1.05;margin:0">inspector-heading</p></div>
  <div class="r-inspector-control-1 region control" data-region="inspector-control-1"><!-- Speed labeled shader control with exact current value: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop inspector-control-1); a control need not have button chrome --></div>
  <div class="r-inspector-control-2 region control" data-region="inspector-control-2"><!-- Waves labeled shader control with exact current value: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop inspector-control-2); a control need not have button chrome --></div>
  <div class="r-inspector-control-3 region control" data-region="inspector-control-3"><!-- Spread labeled shader control with exact current value: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop inspector-control-3); a control need not have button chrome --></div>
  <div class="r-inspector-control-4 region control" data-region="inspector-control-4"><!-- Brightness labeled shader control with exact current value: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop inspector-control-4); a control need not have button chrome --></div>
  <div class="r-inspector-control-5 region control" data-region="inspector-control-5"><!-- Color 1 labeled shader control with exact current value: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop inspector-control-5); a control need not have button chrome --></div>
  <div class="r-inspector-control-6 region control" data-region="inspector-control-6"><!-- Color 2 labeled shader control with exact current value: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop inspector-control-6); a control need not have button chrome --></div>
  <div class="r-inspector-control-7 region control" data-region="inspector-control-7"><!-- Saturation labeled shader control with exact current value: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop inspector-control-7); a control need not have button chrome --></div>
  <div class="r-reset region control" data-region="reset"><!-- Reset shader outline button: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop reset); a control need not have button chrome --></div>
  <div class="r-bank-rule region chrome" data-region="bank-rule"><!-- hairline below bank heading --></div>
  <div class="r-inspector-rule region chrome" data-region="inspector-rule"><!-- hairline below inspector heading --></div>
</main>
</body>
</html>
